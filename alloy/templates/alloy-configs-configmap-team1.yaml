apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-configs-team1
  namespace: {{ include "alloy.namespace" . }}
  labels:
    {{- include "alloy.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
  {{- range $path, $_ := .Files.Glob "config/exporters/team1/*.alloy" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | trim | nindent 4 }}
  {{- end }}