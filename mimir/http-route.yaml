apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mimir-route
  namespace: mimir

spec:
  parentRefs:
  - name: gateway-api
    sectionName: http
    kind: Gateway

  hostnames:
  - mimir.example.com

  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /memberlist
    backendRefs:
    - name: mimir-query-frontend
      port: 8080

  - matches:
    - path:
        type: Exact
        value: /ready
    backendRefs:
        - name: mimir-query-frontend
          port: 8080

  - matches:
    - path:
        type: PathPrefix
        value: /prometheus
    backendRefs:
      - name: mimir-query-frontend
        port: 8080
        weight: 1
        timeouts:
        request: 500ms

  - matches:
    - path:
        type: Exact
        value: /api/v1/push
    backendRefs:
      - name: mimir-distributor-headless 
        port: 8080
        weight: 1

  - matches:
    - path:
        type: Exact
        value: /api/v1/alerts
    backendRefs:
      - name: mimir-alertmanager-headless
        port: 8080
        weight: 1

  - matches:
    - path:
        type: PathPrefix
        value: /prometheus/config/v1/rules
    backendRefs:
      - name: mimir-ruler
        port: 8080

  - matches:
    - path:
        type: PathPrefix
        value: /prometheus/api/v1/rules
    backendRefs:
      - name: mimir-ruler
        port: 8080

  - matches:
    - path:
        type: PathPrefix
        value: /prometheus/api/v1/alerts
    backendRefs:
      - name: mimir-ruler
        port: 8080