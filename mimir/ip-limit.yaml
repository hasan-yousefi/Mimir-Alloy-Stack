apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: mimir-remotewrite-ip-filter
  namespace: mimir
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-api
  action: DENY
  rules:
    - to:
        - operation:
            paths: ["/api/v1/push"]
      from:
        - source:
            notRemoteIpBlocks:
              - "10.240.0.0/16"
              - "192.168.1.128/25"